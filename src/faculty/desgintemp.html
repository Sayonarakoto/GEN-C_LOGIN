<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            background: white;
        }

        .login-card {
            animation: slideInLeft 0.8s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .illustration-section {
            animation: slideInRight 0.8s ease-out;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e5e7eb;
        }

        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .floating-element {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .hologram {
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.8));
            }
        }

        .chart-bar {
            animation: growChart 1s ease-out forwards;
        }

        @keyframes growChart {
            from {
                height: 0;
            }
            to {
                height: 100%;
            }
        }

        .pulse-ring {
            animation: pulse 2s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .checkbox-custom {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .checkbox-custom:checked {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-color: #6366f1;
        }

        .checkbox-custom:checked::after {
            content: '✓';
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .link-hover {
            position: relative;
            color: #6366f1;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .link-hover:hover {
            color: #8b5cf6;
        }

        .link-hover::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: width 0.3s ease;
        }

        .link-hover:hover::after {
            width: 100%;
        }
    </style>
</head>
<body class="bg-white">
    <div class="login-container">
        <!-- Left Section - Login Card -->
        <div class="w-full md:w-2/5 flex items-center justify-center p-8 md:p-12">
            <div class="login-card w-full max-w-md">
                <!-- Header -->
                <div class="mb-8 text-center">
                    <div class="flex items-center justify-center mb-4">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                            <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10.5 1.5H3.75A2.25 2.25 0 001.5 3.75v12.5A2.25 2.25 0 003.75 18.5h12.5a2.25 2.25 0 002.25-2.25V9.5M10.5 1.5v6M10.5 1.5h6v6"/>
                            </svg>
                        </div>
                    </div>
                    <h1 class="text-3xl md:text-4xl font-bold gradient-text mb-2">Learning Hub</h1>
                    <p class="text-gray-500 text-sm md:text-base">Welcome back, Student</p>
                </div>

                <!-- Form -->
                <form class="space-y-5" onsubmit="handleLogin(event)">
                    <!-- Email Input -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input type="email" placeholder="your.email@university.edu" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none" required>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input type="password" id="passwordInput" placeholder="••••••••" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none" required>
                            <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="checkbox-custom">
                            <span class="text-gray-600">Remember me</span>
                        </label>
                        <span class="link-hover">Forgot Password?</span>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-login w-full py-3 rounded-lg text-white font-semibold text-base mt-6">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center gap-3 my-6">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-gray-400 text-sm">or</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="py-2 px-4 border-2 border-gray-200 rounded-lg hover:border-indigo-500 hover:bg-indigo-50 transition duration-300 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032 c0-3.331,2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.461,2.268,15.365,1.156,12.545,1.156 c-6.321,0-11.444,5.125-11.444,11.449c0,6.324,5.125,11.449,11.444,11.449c6.339,0,11.444-5.125,11.444-11.449 c0-0.747-0.092-1.476-0.257-2.18H12.545z"/>
                        </svg>
                    </button>
                    <button type="button" class="py-2 px-4 border-2 border-gray-200 rounded-lg hover:border-indigo-500 hover:bg-indigo-50 transition duration-300 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </button>
                </div>

                <!-- Sign Up Link -->
                <p class="text-center text-gray-600 text-sm mt-6">
                    Don't have an account? <span class="link-hover font-semibold">Sign Up</span>
                </p>
            </div>
        </div>

        <!-- Right Section - Illustration -->
        <div class="hidden md:flex w-3/5 bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 items-center justify-center p-8 relative overflow-hidden illustration-section">
            <!-- Background Elements -->
            <div class="absolute top-10 right-10 w-40 h-40 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 floating-element" style="animation-delay: 0s;"></div>
            <div class="absolute bottom-10 left-10 w-40 h-40 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 floating-element" style="animation-delay: 1s;"></div>

            <!-- Main Illustration Container -->
            <div class="relative w-full h-full flex items-center justify-center">
                <!-- Study Lounge Background -->
                <svg class="absolute inset-0 w-full h-full" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice">
                    <!-- Window -->
                    <rect x="50" y="50" width="150" height="150" fill="#e0f2fe" stroke="#94e2fc" stroke-width="2" rx="10"/>
                    <line x1="125" y1="50" x2="125" y2="200" stroke="#94e2fc" stroke-width="2"/>
                    <line x1="50" y1="125" x2="200" y2="125" stroke="#94e2fc" stroke-width="2"/>
                    
                    <!-- Sunlight rays -->
                    <line x1="100" y1="40" x2="100" y2="20" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
                    <line x1="140" y1="40" x2="140" y2="10" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
                    <line x1="170" y1="50" x2="190" y2="30" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>

                    <!-- Floor -->
                    <rect x="0" y="600" width="600" height="100" fill="#e5e7eb" opacity="0.3"/>
                    <line x1="0" y1="600" x2="600" y2="600" stroke="#d1d5db" stroke-width="1" opacity="0.5"/>
                </svg>

                <!-- Students Container -->
                <div class="relative z-10 flex items-end justify-center gap-12">
                    <!-- Female Student -->
                    <div class="flex flex-col items-center floating-element" style="animation-delay: 0s;">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="35" fill="#d4a574"/>
                        <!-- Hair -->
                        <path d="M -35 -5 Q -35 -45 0 -50 Q 35 -45 35 -5" fill="#8b6f47"/>
                        <!-- Body -->
                        <rect x="-30" y="35" width="60" height="70" fill="#6366f1" rx="5"/>
                        <!-- Arms -->
                        <rect x="-60" y="40" width="30" height="20" fill="#d4a574" rx="10"/>
                        <rect x="30" y="40" width="30" height="20" fill="#d4a574" rx="10"/>
                        <!-- Hands -->
                        <circle cx="-60" cy="55" r="12" fill="#d4a574"/>
                        <circle cx="60" cy="55" r="12" fill="#d4a574"/>
                        <!-- Legs -->
                        <rect x="-20" y="105" width="15" height="50" fill="#2d3748" rx="7"/>
                        <rect x="5" y="105" width="15" height="50" fill="#2d3748" rx="7"/>
                    </div>

                    <!-- Holographic Projection Center -->
                    <div class="relative flex flex-col items-center hologram">
                        <!-- Hologram Glow -->
                        <div class="absolute inset-0 w-48 h-48 bg-gradient-to-r from-purple-400 to-indigo-400 rounded-full blur-2xl opacity-20"></div>
                        
                        <!-- Hologram Frame -->
                        <svg class="relative z-20" width="180" height="180" viewBox="0 0 180 180">
                            <!-- Outer Ring -->
                            <circle cx="90" cy="90" r="85" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
                            <circle cx="90" cy="90" r="80" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
                            
                            <!-- Data Charts -->
                            <g id="chart1">
                                <rect x="20" y="60" width="15" height="50" fill="#10b981" opacity="0.8"/>
                                <rect x="40" y="40" width="15" height="70" fill="#3b82f6" opacity="0.8"/>
                                <rect x="60" y="30" width="15" height="80" fill="#8b5cf6" opacity="0.8"/>
                                <rect x="80" y="50" width="15" height="60" fill="#ec4899" opacity="0.8"/>
                                <rect x="100" y="35" width="15" height="75" fill="#f59e0b" opacity="0.8"/>
                                <rect x="120" y="55" width="15" height="55" fill="#06b6d4" opacity="0.8"/>
                                <rect x="140" y="45" width="15" height="65" fill="#6366f1" opacity="0.8"/>
                            </g>

                            <!-- Formulas/Equations -->
                            <text x="45" y="25" font-size="10" fill="#6366f1" opacity="0.7" font-weight="bold">∑ x²</text>
                            <text x="110" y="25" font-size="10" fill="#8b5cf6" opacity="0.7" font-weight="bold">∫ dx</text>
                            <text x="25" y="150" font-size="10" fill="#ec4899" opacity="0.7" font-weight="bold">f(x)</text>
                            <text x="130" y="150" font-size="10" fill="#3b82f6" opacity="0.7" font-weight="bold">y = mx</text>

                            <!-- Connecting Lines -->
                            <line x1="20" y1="90" x2="160" y2="90" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
                            <line x1="90" y1="10" x2="90" y2="170" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
                        </svg>

                        <!-- Floating Icons -->
                        <div class="absolute -top-12 -right-12 floating-element" style="animation-delay: 0.5s;">
                            <div class="w-12 h-12 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-full flex items-center justify-center shadow-lg">
                                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path>
                                </svg>
                            </div>
                        </div>

                        <div class="absolute -bottom-12 -left-12 floating-element" style="animation-delay: 1s;">
                            <div class="w-12 h-12 bg-gradient-to-br from-pink-400 to-rose-500 rounded-full flex items-center justify-center shadow-lg">
                                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zm3.5 1a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"></path>
                                </svg>
                            </div>
                        </div>

                        <div class="absolute top-1/2 -right-16 floating-element" style="animation-delay: 1.5s;">
                            <div class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-amber-500 rounded-full flex items-center justify-center shadow-lg">
                                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M2 3a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1V3zM11 3a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1h-6a1 1 0 01-1-1V3zM2 12a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1v-6zM13 11a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1v-6a1 1 0 00-1-1h-6z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Male Student -->
                    <div class="flex flex-col items-center floating-element" style="animation-delay: 0.7s;">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="35" fill="#c9a876"/>
                        <!-- Hair -->
                        <ellipse cx="0" cy="-30" rx="38" ry="25" fill="#5a4a3a"/>
                        <!-- Body -->
                        <rect x="-30" y="35" width="60" height="70" fill="#8b5cf6" rx="5"/>
                        <!-- Arms -->
                        <rect x="-60" y="40" width="30" height="20" fill="#c9a876" rx="10"/>
                        <rect x="30" y="40" width="30" height="20" fill="#c9a876" rx="10"/>
                        <!-- Hands -->
                        <circle cx="-60" cy="55" r="12" fill="#c9a876"/>
                        <circle cx="60" cy="55" r="12" fill="#c9a876"/>
                        <!-- Legs -->
                        <rect x="-20" y="105" width="15" height="50" fill="#1f2937" rx="7"/>
                        <rect x="5" y="105" width="15" height="50" fill="#1f2937" rx="7"/>
                    </div>
                </div>

                <!-- Progress Bar Floating -->
                <div class="absolute bottom-32 left-12 floating-element" style="animation-delay: 0.3s;">
                    <div class="bg-white rounded-full shadow-lg p-3 w-40">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                            <span class="text-xs font-semibold text-gray-700">Learning Progress</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 h-full" style="width: 75%; animation: growChart 1s ease-out;"></div>
                        </div>
                        <span class="text-xs text-gray-500 mt-1 block">75% Complete</span>
                    </div>
                </div>

                <!-- Video Call Icon Floating -->
                <div class="absolute top-32 right-20 floating-element" style="animation-delay: 1.2s;">
                    <div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-full flex items-center justify-center shadow-lg cursor-pointer hover:shadow-xl transition">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 3a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1V3zM12 3a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1h-6a1 1 0 01-1-1V3zM2 13a1 1 0 011-1h6a1 1 0 011 1v2a1 1 0 01-1 1H3a1 1 0 01-1-1v-2zM16 13a1 1 0 00-1 1v2a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 00-1-1h-2z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Magnifying Glass Icon -->
                <div class="absolute bottom-20 right-16 floating-element" style="animation-delay: 0.5s;">
                    <div class="w-14 h-14 bg-gradient-to-br from-purple-400 to-pink-500 rounded-full flex items-center justify-center shadow-lg cursor-pointer hover:shadow-xl transition">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const email = event.target.querySelector('input[type="email"]').value;
            const password = event.target.querySelector('input[type="password"]').value;
            
            // Create a visual feedback
            const button = event.target.querySelector('button[type="submit"]');
            const originalText = button.textContent;
            button.textContent = 'Signing In...';
            button.disabled = true;
            
            // Simulate login process
            setTimeout(() => {
                button.textContent = '✓ Success!';
                button.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.disabled = false;
                    button.style.background = '';
                }, 2000);
            }, 1500);
        }
    </script>
</body>
</html>
